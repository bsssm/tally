name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22]
    env:
      # Keep CI off the macOS Keychain; the keystore falls back to env / passphrase.
      TALLY_KEY_SOURCE: passphrase
      TALLY_PASSPHRASE: ci-only-passphrase
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - name: fresh-machine (npx tallyai from a packed tarball, no key, under 60s)
        run: bash scripts/fresh-machine.sh
